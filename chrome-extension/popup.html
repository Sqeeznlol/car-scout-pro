<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; width: 320px; padding: 16px; margin: 0; background: #f9fafb; }
    h1 { font-size: 16px; margin: 0 0 12px; color: #111827; }
    .status { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .status.empty { background: #fef3c7; color: #92400e; }
    .row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
    .row:last-child { border-bottom: none; }
    .label { color: #6b7280; }
    .value { font-weight: 600; color: #111827; }
    a { color: #6366f1; text-decoration: none; font-size: 13px; }
    a:hover { text-decoration: underline; }
    .footer { margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>Autosnipe Sync</h1>
  <div id="status" class="status empty">Öffne ein mobile.de Inserat um zu synchronisieren.</div>
  <div id="details"></div>
  <div class="footer">
    <a href="https://autosnipe.shop/queue" target="_blank">→ Queue öffnen</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
