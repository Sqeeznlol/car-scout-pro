<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; width: 380px; padding: 14px; margin: 0; background: #f9fafb; color: #111827; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 11px; color: #6b7280; margin-bottom: 12px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin: 0 0 6px; display:flex; justify-content:space-between; align-items:center; }
    .row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
    .label { color: #6b7280; }
    .value { font-weight: 600; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: 600; font-size: 13px; }
    .btn-start { background: #10b981; }
    .btn-stop { background: #ef4444; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { padding: 8px 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; font-weight: 500; }
    .status.idle { background: #f3f4f6; color: #374151; }
    .status.run { background: #dbeafe; color: #1e40af; }
    .status.done { background: #d1fae5; color: #065f46; }
    .list { max-height: 160px; overflow-y: auto; font-size: 11px; }
    .list-item { padding: 5px 6px; border-bottom: 1px solid #f3f4f6; display:flex; gap:6px; align-items:center; }
    .list-item:last-child { border-bottom: none; }
    .list-item .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .dot.ok { background:#10b981; } .dot.err { background:#ef4444; } .dot.curr { background:#3b82f6; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100% {opacity:1} 50%{opacity:.3} }
    .list-item a { color: #6366f1; text-decoration: none; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .list-item .ts { color:#9ca3af; font-size:10px; flex-shrink:0; }
    .clearbtn { background:none; color:#6b7280; padding:0; width:auto; font-size:10px; font-weight:400; cursor:pointer; }
    .empty { padding: 10px; text-align:center; color:#9ca3af; font-size:11px; }
    .footer { text-align: center; margin-top: 10px; }
    a.foot { color: #6366f1; text-decoration: none; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Autosnipe Worker</h1>
  <div class="sub">Anti-Ban Modus: 8–18s zwischen Inseraten, Pause nach jeweils 12, max 50/h.</div>

  <div id="status" class="status idle">Bereit.</div>

  <button id="ctrlBtn" class="btn-start">▶ Start</button>

  <div class="card" style="margin-top:10px">
    <h2>Schutz-Limits</h2>
    <div class="row"><span class="label">Letzte Stunde</span><span class="value" id="s-hour">0 / 50</span></div>
    <div class="row"><span class="label">Letzte 24h</span><span class="value" id="s-day">0 / 250</span></div>
    <div class="row"><span class="label">Cooldown</span><span class="value" id="s-cool">—</span></div>
    <button id="clearCooldown" class="clearbtn" style="margin-top:6px;color:#ef4444">Cooldown aufheben</button>
  </div>

  <div class="card">
    <h2>Statistik</h2>
    <div class="row"><span class="label">In Warteschlange</span><span class="value" id="s-queue">0</span></div>
    <div class="row"><span class="label">Verarbeitet</span><span class="value" id="s-proc">0</span></div>
    <div class="row"><span class="label">Fehler</span><span class="value" id="s-err">0</span></div>
    <div class="row"><span class="label">Bot-Blocks</span><span class="value" id="s-blk">0</span></div>

  <div class="card">
    <h2>Warteschlange <span id="qcount" style="color:#9ca3af">0</span></h2>
    <div id="queueList" class="list"></div>
  </div>

  <div class="card">
    <h2>Verlauf <button id="clearHist" class="clearbtn">leeren</button></h2>
    <div id="historyList" class="list"></div>
  </div>

  <div class="footer">
    <a class="foot" href="https://autosnipe.shop/queue" target="_blank">→ Swipe Queue öffnen</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
